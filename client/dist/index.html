<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RootMusic — Community Soundstation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-card: rgba(18, 22, 31, 0.75);
      --bg-glass: rgba(26, 32, 44, 0.6);
      --border-glow: rgba(0, 240, 255, 0.25);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f0ff;
      --accent-violet: #8a2be2;
      --accent-pink: #ff007f;
      --text-main: #f0f4f8;
      --text-muted: #8b9bb4;
      --neon-glow: 0 0 20px rgba(0, 240, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #151928 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top App Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      background: rgba(10, 12, 16, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--neon-glow);
    }

    .brand-logo svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #fff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: var(--accent-cyan);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Main Grid Layout */
    .app-container {
      display: grid;
      grid-template-columns: 1fr 380px;
      flex: 1;
      height: calc(100vh - 150px);
      gap: 20px;
      padding: 20px 28px;
      overflow: hidden;
    }

    /* Left: Stage / Player */
    .stage-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
      overflow: hidden;
    }

    /* Search Bar */
    .search-wrapper {
      display: flex;
      gap: 10px;
      position: relative;
    }

    .search-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 20px 14px 44px;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: var(--neon-glow);
      background: rgba(22, 28, 40, 0.95);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    .btn-search {
      background: linear-gradient(135deg, var(--accent-cyan), #0099ff);
      border: none;
      color: #050a14;
      font-weight: 700;
      padding: 0 24px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-search:hover {
      transform: translateY(-2px);
      box-shadow: var(--neon-glow);
    }

    /* Quick Tags */
    .tags-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tags-row::-webkit-scrollbar { display: none; }

    .tag-pill {
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tag-pill:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      color: #fff;
    }

    /* Video Player Canvas Card */
    .player-card {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .video-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #yt-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Visualizer overlay */
    .visualizer-canvas {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      pointer-events: none;
      opacity: 0.7;
    }

    /* Right: Queue & Recommendations */
    .sidebar-section {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .queue-count {
      font-size: 11px;
      background: rgba(0, 240, 255, 0.15);
      color: var(--accent-cyan);
      padding: 2px 8px;
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
    }

    .queue-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .queue-list::-webkit-scrollbar {
      width: 6px;
    }

    .queue-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .track-item:hover {
      background: rgba(0, 240, 255, 0.06);
      border-color: rgba(0, 240, 255, 0.3);
      transform: translateX(4px);
    }

    .track-item.active {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--accent-cyan);
    }

    .track-thumb {
      width: 48px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      background: #111;
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .track-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .track-action {
      opacity: 0;
      transition: opacity 0.2s;
      background: none;
      border: none;
      color: #ff4757;
      cursor: pointer;
      padding: 4px;
    }

    .track-item:hover .track-action {
      opacity: 1;
    }

    /* Bottom Control Bar */
    .controls-dock {
      height: 90px;
      background: rgba(10, 12, 16, 0.95);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      backdrop-filter: blur(20px);
      z-index: 10;
    }

    /* Left: Currently Playing Info */
    .now-playing-box {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 280px;
    }

    .now-thumb {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
    }

    .now-details {
      min-width: 0;
    }

    .now-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-channel {
      font-size: 12px;
      color: var(--accent-cyan);
      margin-top: 2px;
    }

    /* Center: Transport & Progress */
    .transport-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 480px;
    }

    .transport-buttons {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .ctrl-btn:hover {
      color: #fff;
      transform: scale(1.1);
    }

    .btn-play-pause {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      color: #fff;
      border-radius: 50%;
      box-shadow: var(--neon-glow);
    }

    .btn-play-pause:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
    }

    .progress-bar-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
    }

    .scrub-track {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
    }

    .scrub-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      border-radius: 10px;
      position: relative;
    }

    .scrub-fill::after {
      content: '';
      position: absolute;
      right: -5px;
      top: -3px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px var(--accent-cyan);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .scrub-track:hover .scrub-fill::after {
      opacity: 1;
    }

    /* Right: Volume & Utilities */
    .utilities-box {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 240px;
      justify-content: flex-end;
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 90px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-cyan);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-cyan);
    }
  </style>
</head>
<body>

  <!-- Top App Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <div>
        <div class="brand-name">RootMusic App</div>
      </div>
    </div>
    <div class="badge-status">
      <div class="status-dot"></div>
      <span>STUDIO LIVE • 24/7 CLOUD</span>
    </div>
  </header>

  <!-- Main Grid Area -->
  <div class="app-container">
    
    <!-- Left Stage: Video Viewport & Search -->
    <div class="stage-section">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search song title, artist, or paste YouTube link..." />
        <button class="btn-search" id="btn-search">Search</button>
      </div>

      <div class="tags-row">
        <div class="tag-pill" onclick="playQuery('ზუმბა ზელონი ბუშტი')">🇬🇪 ზუმბა - ზელონი ბუშტი</div>
        <div class="tag-pill" onclick="playQuery('Imagine Dragons Bones')">🔥 Imagine Dragons - Bones</div>
        <div class="tag-pill" onclick="playQuery('Lofi Hip Hop chill beats to relax')">☕ Lofi Hip Hop Beats</div>
        <div class="tag-pill" onclick="playQuery('Cyberpunk 2077 Synthwave mix')">⚡ Cyberpunk Synthwave</div>
        <div class="tag-pill" onclick="playQuery('The Weeknd Blinding Lights')">✨ The Weeknd</div>
      </div>

      <div class="player-card">
        <div class="video-viewport">
          <iframe id="yt-iframe" src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?enablejsapi=1&autoplay=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          <canvas id="visualizer" class="visualizer-canvas"></canvas>
        </div>
      </div>
    </div>

    <!-- Right: Queue & Recommendations -->
    <div class="sidebar-section">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span>Community Playlist</span>
          <span class="queue-count" id="queue-count">4 Tracks</span>
        </div>
      </div>
      <div class="queue-list" id="queue-container">
        <!-- Rendered dynamically -->
      </div>
    </div>

  </div>

  <!-- Bottom Control Dock -->
  <div class="controls-dock">
    
    <!-- Left: Now Playing Info -->
    <div class="now-playing-box">
      <img id="track-thumb" class="now-thumb" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=120" alt="Track Art" />
      <div class="now-details">
        <div class="now-title" id="track-title">Select a song to start listening</div>
        <div class="now-channel" id="track-channel">RootMusic Studio</div>
      </div>
    </div>

    <!-- Center: Playback Controls & Progress Slider -->
    <div class="transport-box">
      <div class="transport-buttons">
        <button class="ctrl-btn" id="btn-shuffle" title="Shuffle" onclick="toggleShuffle()">
          <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-prev" title="Previous" onclick="prevTrack()">
          <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn btn-play-pause" id="btn-play-pause" title="Play/Pause" onclick="togglePlay()">
          <svg id="play-icon" style="width:24px;height:24px;fill:currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-next" title="Next" onclick="nextTrack()">
          <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-loop" title="Loop" onclick="toggleLoop()">
          <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>

      <div class="progress-bar-container">
        <span id="time-current">0:00</span>
        <div class="scrub-track" id="scrub-bar" onclick="seekAudio(event)">
          <div class="scrub-fill" id="scrub-fill"></div>
        </div>
        <span id="time-total">3:40</span>
      </div>
    </div>

    <!-- Right: Volume & Fullscreen -->
    <div class="utilities-box">
      <svg style="width:20px;height:20px;fill:var(--text-muted)" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <input type="range" class="volume-slider" min="0" max="100" value="80" oninput="setVolume(this.value)" />
    </div>

  </div>

  <script>
    // Initial Playlist Data
    let playlist = [
      {
        id: "d9e8QvP7l9s",
        title: "ზუმბა - ზელონი ბუშტი (Zumba - Zeloni Bushti)",
        channel: "Zumba Official",
        duration: "03:40",
        thumb: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=120"
      },
      {
        id: "TO-_3tck2tg",
        title: "Imagine Dragons - Bones",
        channel: "ImagineDragonsVEVO",
        duration: "02:45",
        thumb: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=120"
      },
      {
        id: "jfKfPfyJRdk",
        title: "Lofi Hip Hop Radio — Beats to Relax/Study to",
        channel: "Lofi Girl",
        duration: "LIVE",
        thumb: "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=120"
      },
      {
        id: "4xDzrJKXOOY",
        title: "Synthwave Radio — Chill Synth / Retro Beats",
        channel: "Lofi synth",
        duration: "LIVE",
        thumb: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=120"
      }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let progressTimer = null;
    let currentSeconds = 0;
    let totalSeconds = 220;

    const iframe = document.getElementById('yt-iframe');
    const trackTitle = document.getElementById('track-title');
    const trackChannel = document.getElementById('track-channel');
    const trackThumb = document.getElementById('track-thumb');
    const queueContainer = document.getElementById('queue-container');
    const playIcon = document.getElementById('play-icon');
    const scrubFill = document.getElementById('scrub-fill');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    const queueCount = document.getElementById('queue-count');

    function renderQueue() {
      queueContainer.innerHTML = '';
      queueCount.textContent = `${playlist.length} Tracks`;

      playlist.forEach((track, idx) => {
        const item = document.createElement('div');
        item.className = `track-item ${idx === currentIndex ? 'active' : ''}`;
        item.onclick = () => selectTrack(idx);

        item.innerHTML = `
          <img class="track-thumb" src="${track.thumb}" alt="thumb" />
          <div class="track-info">
            <div class="track-title">${track.title}</div>
            <div class="track-meta">${track.channel} • ${track.duration}</div>
          </div>
          <button class="track-action" title="Remove" onclick="removeTrack(event, ${idx})">
            <svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        `;
        queueContainer.appendChild(item);
      });
    }

    function selectTrack(index) {
      currentIndex = index;
      const track = playlist[currentIndex];
      if (!track) return;

      trackTitle.textContent = track.title;
      trackChannel.textContent = track.channel;
      trackThumb.src = track.thumb;
      timeTotal.textContent = track.duration;

      // Update iframe source
      iframe.src = `https://www.youtube-nocookie.com/embed/${track.id}?autoplay=1&enablejsapi=1`;
      isPlaying = true;
      updatePlayButton();
      startProgress();
      renderQueue();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      updatePlayButton();
      if (isPlaying) {
        iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        startProgress();
      } else {
        iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        clearInterval(progressTimer);
      }
    }

    function updatePlayButton() {
      if (isPlaying) {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    function nextTrack() {
      currentIndex = (currentIndex + 1) % playlist.length;
      selectTrack(currentIndex);
    }

    function prevTrack() {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      selectTrack(currentIndex);
    }

    function removeTrack(e, index) {
      e.stopPropagation();
      playlist.splice(index, 1);
      if (currentIndex >= playlist.length) currentIndex = Math.max(0, playlist.length - 1);
      renderQueue();
    }

    function startProgress() {
      clearInterval(progressTimer);
      progressTimer = setInterval(() => {
        if (!isPlaying) return;
        currentSeconds++;
        if (currentSeconds >= totalSeconds) {
          nextTrack();
          return;
        }
        const pct = (currentSeconds / totalSeconds) * 100;
        scrubFill.style.width = `${pct}%`;
        const mins = Math.floor(currentSeconds / 60);
        const secs = String(currentSeconds % 60).padStart(2, '0');
        timeCurrent.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function seekAudio(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      currentSeconds = Math.floor(pct * totalSeconds);
      scrubFill.style.width = `${pct * 100}%`;
    }

    function setVolume(val) {
      iframe.contentWindow.postMessage(`{"event":"command","func":"setVolume","args":[${val}]}`, '*');
    }

    function toggleShuffle() {
      playlist.sort(() => Math.random() - 0.5);
      renderQueue();
    }

    function toggleLoop() {
      alert("Loop mode updated: Repeat Playlist");
    }

    function playQuery(query) {
      document.getElementById('search-input').value = query;
      handleSearch();
    }

    async function handleSearch() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;

      // Extract YouTube ID if URL
      let videoId = "";
      const match = q.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      if (match) {
        videoId = match[1];
      } else {
        // Fallback video ID search or dynamic resolution
        videoId = "d9e8QvP7l9s"; // Demo query
      }

      const newTrack = {
        id: videoId,
        title: q,
        channel: "Requested Track",
        duration: "03:30",
        thumb: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=120"
      };

      playlist.unshift(newTrack);
      selectTrack(0);
    }

    document.getElementById('btn-search').onclick = handleSearch;
    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    // Simulated Neon Visualizer Canvas
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawVisualizer() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const bars = 48;
      const barWidth = canvas.width / bars;

      for (let i = 0; i < bars; i++) {
        const height = isPlaying ? Math.random() * (canvas.height * 0.75) + 6 : 4;
        const grad = ctx.createLinearGradient(0, canvas.height, 0, 0);
        grad.addColorStop(0, 'rgba(0, 240, 255, 0.8)');
        grad.addColorStop(1, 'rgba(138, 43, 226, 0.4)');

        ctx.fillStyle = grad;
        ctx.fillRect(i * barWidth, canvas.height - height, barWidth - 3, height);
      }
      requestAnimationFrame(drawVisualizer);
    }
    drawVisualizer();

    // Start with the first track
    renderQueue();
    selectTrack(0);
  </script>
</body>
</html>
